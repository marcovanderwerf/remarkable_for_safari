# Runs whenever the Gmail Apps Script drops an email into inbox/.
name: Send to reMarkable
on:
  push:
    paths: ['inbox/*.json']
  workflow_dispatch:
concurrency: remarkable          # one run at a time; later pushes queue
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu >/dev/null
          pip install -q weasyprint trafilatura beautifulsoup4 lxml markdown requests pypdfium2
      - name: Install and log in rmapi
        env:
          RMAPI_DEVICE_TOKEN: ${{ secrets.RMAPI_DEVICE_TOKEN }}
        run: |
          curl -sSL https://github.com/ddvk/rmapi/releases/latest/download/rmapi-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install -m 755 "$(find /tmp -maxdepth 2 -name rmapi -type f | head -1)" /usr/local/bin/rmapi
          mkdir -p ~/.config/rmapi
          printf 'devicetoken: %s\nusertoken: ""\n' "$RMAPI_DEVICE_TOKEN" > ~/.config/rmapi/rmapi.conf
          rmapi -ni ls / >/dev/null
      - name: Render and upload
        id: run
        run: python3 pipeline/process_inbox.py inbox
      - name: Clear processed emails
        if: always()
        run: |
          git config user.name "reMarkable mailroom"
          git config user.email "actions@users.noreply.github.com"
          git add -A inbox
          git diff --cached --quiet || git commit -qm "Processed inbox" && git push -q || true
