# Installed into the private mailroom repo by the Apps Script's install().
# Runs whenever an email lands in inbox/; code comes from the public repo.
name: Send to reMarkable
on:
  push:
    paths: ['inbox/*.json']
  workflow_dispatch:
concurrency: remarkable
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: marcovanderwerf/remarkable_for_safari
          ref: __CODE_REF__
          path: code
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: code/email-pipeline/requirements.txt }
      - name: Install renderer and fonts
        run: |
          sudo apt-get install -y -qq fonts-inter >/dev/null 2>&1 || true
          mkdir -p ~/.fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl/literata
          curl -sSfL -o ~/.fonts/Literata.ttf "$base/Literata%5Bopsz,wght%5D.ttf" || true
          curl -sSfL -o ~/.fonts/Literata-Italic.ttf "$base/Literata-Italic%5Bopsz,wght%5D.ttf" || true
          fc-cache -f >/dev/null
          pip install -q -r code/email-pipeline/requirements.txt
      - name: Log in to reMarkable
        env:
          RMAPI_DEVICE_TOKEN: ${{ secrets.RMAPI_DEVICE_TOKEN }}
        run: |
          test -n "$RMAPI_DEVICE_TOKEN" || { echo "::error::Add the RMAPI_DEVICE_TOKEN secret"; exit 1; }
          curl -sSL https://github.com/ddvk/rmapi/releases/latest/download/rmapi-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install -m 755 "$(find /tmp -maxdepth 2 -name rmapi -type f | head -1)" /usr/local/bin/rmapi
          mkdir -p ~/.config/rmapi
          printf 'devicetoken: %s\nusertoken: ""\n' "$RMAPI_DEVICE_TOKEN" > ~/.config/rmapi/rmapi.conf
          rmapi -ni ls / >/dev/null
      - name: Render and upload
        run: python3 code/email-pipeline/process_inbox.py inbox
      - name: Clear processed emails
        if: always()
        run: |
          git config user.name "reMarkable mailroom"
          git config user.email "actions@users.noreply.github.com"
          git add -A inbox
          if ! git diff --cached --quiet; then
            git commit -qm "Processed inbox"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
